[workspace]
resolver = "2"
members = [
    "crates/*",
    "services/*"
]

[workspace.dependencies]
actix-web = "4"
actix-cors = "0.6"
actix-ws = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "time"] }
rdkafka = "0.36"
solana-sdk = "2.0.7"
anchor-client = "0.30.1"
dotenvy = "0.15"
